<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b1230">
<meta name="apple-mobile-web-app-title" content="Sold Raptor">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="icon" href="apple-touch-icon.png">
<title>Sold Raptor</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #1b1230; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
'use strict';
/* =============================================================================
   SOLD RAPTOR — a 16-bit style endless side-scroller.
   One file, plain HTML5 Canvas + JavaScript, no external libraries.

   File map (search for the "== N." banners):
     1. CONFIG ............ tune physics, speeds, timers here
     2. SPRITE_FILES ...... drop in your own PNG sprites / backgrounds here
     3. PixelArt helper ... tiny pixel-buffer used to draw all built-in art
     4. Font .............. 3x5 bitmap pixel font
     5. Sprite builders ... raptor+rider, houses, enemies, blocks, scenery...
     6. Sound ............. 8-bit effects with the Web Audio API
     7. Game state + level generator (hand-designed chunks)
     8. Update (physics, collisions, game rules)
     9. Render (parallax, world, HUD, screens)
    10. Input + main loop
   ============================================================================= */

/* == 1. CONFIG =============================================================== */
const CFG = {
  VIEW_H: 235,              // game units tall (width adapts to screen shape)
  ART_SCALE: 2,             // the canvas has 2 real pixels per game unit, so your
                            // reference art keeps its full detail (see section 2)
  MIN_W: 360, MAX_W: 520,
  GROUND_H: 39.5,           // grass + dirt strip height (matches the reference art)
  GROUND_SINK: 5.5,         // feet walk this far down into the grass strip, like the reference

  // Player physics (pixels, seconds). Snappy, classic-platformer feel.
  JUMP_V: 520,              // initial jump velocity
  GRAVITY_UP: 1200,         // gravity while rising AND holding jump (long jump)
  GRAVITY_DOWN: 2400,       // gravity when falling or button released (snappy)
  JUMP_CUT: 220,            // releasing early clamps upward speed to this (short hop)
  MAX_FALL: 700,
  COYOTE: 0.10,             // grace period to jump after running off a ledge
  JUMP_BUFFER: 0.12,        // a press just before landing still counts
  STOMP_BOUNCE: 300, STOMP_BOUNCE_HELD: 470,
  CAMERA_TOP: 6,           // camera pans up when the rider's head goes above this

  // World speed / difficulty
  BASE_SPEED: 95,           // starting scroll speed (units/s)
  SPEED_STEP: 12,           // added every HOUSES_PER_LEVEL houses
  MAX_SPEED: 200,
  HOUSES_PER_LEVEL: 5,
  ESPRESSO_SPEED_MULT: 1.4,

  START_HEARTS: 3, MAX_HEARTS: 5, HURT_TIME: 2,
  POWER_TIME: { espresso: 8.5, key: 10, cash: 5 },     // espresso = the ESPRO cup, cash = money bag
  MAGNET_RADIUS: 130,

  // Parallax factors (1 = moves with the ground)
  PARALLAX: { clouds: 0.06, skyline: 0.1, backdrop: 0.2, palms: 0.5, ferns: 0.8 },
};

/* == 2. SPRITES FROM YOUR ART ==================================================
   Built from your reference images (see tools/ and sprites/):
     raptor_run_0..11     the 12-frame walk cycle from your green-screen sheet
                          (reference/walk_sheet.webp, via tools/sheet_frames.py)
     raptor_rise / raptor_peak / raptor_fall
                          jump poses made from those frames, tail and hair swung
     ..._open             lower jaw dropped, for swallowing houses
     ..._espro            pink suit + unicorn horn for the ESPRO power-up
                          (tools/sheet_variants.py builds all of these)
     house_0        the tiny cabin (reference 2)
     sold_sign      the SOLD sign (reference 3)
     palms, palm_small, fern, cloud_0..2, skyline, backdrop (mountains + forest),
     ground         scenery cut from the references
   They are embedded as data URIs at the very bottom of this file
   (EMBEDDED_SPRITES), so the game stays a single file. They are stored at
   0.459x the size of your original images and drawn at half their pixel size
   (CFG.ART_SCALE), which puts everything at exactly the scale of the references
   while keeping their detail.

   To swap in more of your own art, map a sprite name to an image path here.
   Like the embedded art, these images are drawn at half their pixel size
   (a 70x55 image shows as a 35x27 house). Anything listed overrides both
   the embedded and the code-drawn sprites:
     lowballer_0, lowballer_1, lowballer_flat     briefcase enemy (20x18)
     redtape_0..3             spiky red-tape roll, rolling frames (22x22)
     coin_0..3                spinning coin (12x14)
     block_key, block_used, block_brick           16x16 blocks
     pu_espresso, pu_key, pu_cash, pu_heart       16x16 power-ups
     house_0..3               houses, 70x55 pixels, drawn standing on the grass
     heart_full, heart_empty, icon_house          HUD icons
     ...and any of the names listed above.
   Example:   house_1: 'sprites/my_spanish_house.png',
   ============================================================================= */
const SPRITE_FILES = {
  // house_1: 'sprites/my_spanish_house.png',
};

// Where things are on the raptor frames (170x120 art = 85x60 game units),
// in game units relative to the player's anchor: (playerX, feet line).
// If you replace the raptor frames with different art, adjust these.
const RAPTOR = {
  anchorX: 51.5,                   // game-unit column of the sprite that sits on playerX
  hitL: -20, hitR: 24, hitH: 55,   // body hitbox (the long tail doesn't count)
  headX: -4,                       // rider's head: bumps blocks from below
  mouth: [26, -25],                // houses get swallowed here
  rear: [-25, -22],                // SOLD signs pop out here
  feet: [-21, 5],                  // dust puffs
};

/* == 3. PixelArt helper ========================================================
   A small pixel buffer with crisp (non-anti-aliased) shape drawing, automatic
   1px outlines and conversion to a canvas. Colors are '#rrggbb' strings,
   null = transparent. (ox, oy) shifts the drawing origin.
   ============================================================================= */
const rgbCache = {};
function hexToRgb(h) {
  let c = rgbCache[h];
  if (!c) { c = rgbCache[h] = [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
  return c;
}
class PixelArt {
  // w, h: size in real pixels. k: real pixels per design pixel (lets one drawing be built at another size).
  constructor(w, h, ox = 0, oy = 0, k = 1) { this.w = w; this.h = h; this.ox = ox; this.oy = oy; this.k = k; this.p = new Array(w * h).fill(null); }
  set(x, y, c) {
    x = Math.floor(x) + this.ox; y = Math.floor(y) + this.oy;
    const k = this.k;
    if (k === 1) {
      if (x < 0 || y < 0 || x >= this.w || y >= this.h) return;
      this.p[y * this.w + x] = c; return;
    }
    for (let ry = Math.floor(y * k); ry < Math.floor((y + 1) * k); ry++)
      for (let rx = Math.floor(x * k); rx < Math.floor((x + 1) * k); rx++)
        if (rx >= 0 && ry >= 0 && rx < this.w && ry < this.h) this.p[ry * this.w + rx] = c;
  }
  get(x, y) {
    x = Math.floor((Math.floor(x) + this.ox) * this.k); y = Math.floor((Math.floor(y) + this.oy) * this.k);
    if (x < 0 || y < 0 || x >= this.w || y >= this.h) return null;
    return this.p[y * this.w + x];
  }
  rect(x, y, w, h, c) { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) this.set(x + i, y + j, c); return this; }
  ellipse(cx, cy, rx, ry, c) {
    for (let y = Math.floor(cy - ry) - 1; y <= Math.ceil(cy + ry); y++)
      for (let x = Math.floor(cx - rx) - 1; x <= Math.ceil(cx + rx); x++) {
        const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry;
        if (dx * dx + dy * dy <= 1) this.set(x, y, c);
      }
    return this;
  }
  circle(cx, cy, r, c) { return this.ellipse(cx, cy, r, r, c); }
  poly(pts, c) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const [x, y] of pts) { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); }
    for (let y = Math.floor(y0); y <= Math.ceil(y1); y++)
      for (let x = Math.floor(x0); x <= Math.ceil(x1); x++) {
        const px = x + 0.5, py = y + 0.5; let inside = false;
        for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
          const [xi, yi] = pts[i], [xj, yj] = pts[j];
          if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi) inside = !inside;
        }
        if (inside) this.set(x, y, c);
      }
    return this;
  }
  line(x0, y0, x1, y1, c, t = 1) {
    const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), 1), off = Math.floor((t - 1) / 2);
    for (let i = 0; i <= n; i++) {
      const x = Math.round(x0 + (x1 - x0) * i / n), y = Math.round(y0 + (y1 - y0) * i / n);
      for (let a = 0; a < t; a++) for (let b = 0; b < t; b++) this.set(x - off + a, y - off + b, c);
    }
    return this;
  }
  // fn(localX, localY, color) -> new color. Visits filled pixels only.
  recolor(fn) {
    for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
      const i = y * this.w + x, c = this.p[i];
      if (c !== null) { const n = fn(Math.floor(x / this.k) - this.ox, Math.floor(y / this.k) - this.oy, c); if (n !== undefined) this.p[i] = n; }
    }
    return this;
  }
  // Light top edge / dark bottom edge of every pixel of color `match`.
  shade(match, top, bottom) {
    const s = this.p.slice(), w = this.w;
    for (let i = 0; i < s.length; i++) {
      if (s[i] !== match) continue;
      const y = (i / w) | 0;
      const up = y > 0 ? s[i - w] : null, dn = y < this.h - 1 ? s[i + w] : null;
      if (top && up === null) this.p[i] = top; else if (bottom && dn === null) this.p[i] = bottom;
    }
    return this;
  }
  // 1px outline around everything drawn so far (4-neighbour, classic look).
  outline(c) {
    const s = this.p.slice(), w = this.w, h = this.h;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * w + x;
      if (s[i] !== null) continue;
      if ((x > 0 && s[i - 1] !== null) || (x < w - 1 && s[i + 1] !== null) ||
          (y > 0 && s[i - w] !== null) || (y < h - 1 && s[i + w] !== null)) this.p[i] = c;
    }
    return this;
  }
  stamp(o) { for (let i = 0; i < this.p.length; i++) if (o.p[i] !== null) this.p[i] = o.p[i]; return this; }
  text(str, x, y, c) {
    for (let i = 0; i < str.length; i++) {
      const g = FONT[str[i]] || FONT['?'];
      for (let r = 0; r < 5; r++) for (let k = 0; k < 3; k++) if (g[r * 3 + k] === '1') this.set(x + i * 4 + k, y + r, c);
    }
    return this;
  }
  toCanvas() {
    const cv = document.createElement('canvas'); cv.width = this.w; cv.height = this.h;
    const cx = cv.getContext('2d'), img = cx.createImageData(this.w, this.h);
    for (let i = 0; i < this.p.length; i++) {
      const c = this.p[i]; if (c === null) continue;
      const [r, g, b] = hexToRgb(c);
      img.data[i * 4] = r; img.data[i * 4 + 1] = g; img.data[i * 4 + 2] = b; img.data[i * 4 + 3] = 255;
    }
    cx.putImageData(img, 0, 0);
    return cv;
  }
}
function mulberry32(a) {
  return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const hash = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

/* == 4. Font: 3x5 pixel glyphs (rows top to bottom, '1' = filled) ========== */
const FONT = {
  A:'010101111101101', B:'110101110101110', C:'011100100100011', D:'110101101101110', E:'111100110100111',
  F:'111100110100100', G:'011100101101011', H:'101101111101101', I:'111010010010111', J:'001001001101010',
  K:'101101110101101', L:'100100100100111', M:'101111111101101', N:'110101101101101', O:'010101101101010',
  P:'110101110100100', Q:'010101101110011', R:'110101110101101', S:'011100010001110', T:'111010010010010',
  U:'101101101101111', V:'101101101101010', W:'101101111111101', X:'101101010101101', Y:'101101010010010',
  Z:'111001010100111',
  '0':'111101101101111', '1':'010110010010111', '2':'110001010100111', '3':'110001010001110', '4':'101101111001001',
  '5':'111100110001110', '6':'011100111101111', '7':'111001010010010', '8':'111101111101111', '9':'111101111001110',
  ':':'000010000010000', '.':'000000000000010', '!':'010010010000010', '-':'000000111000000', '+':'000010111010000',
  '*':'000101010101000', '?':'110001010000010', "'":'010010000000000', '/':'001001010100100', ',':'000000000010100',
  ' ':'000000000000000',
};

/* == 5. Sprite builders ========================================================
   All built-in art. Each builder returns a PixelArt that becomes a canvas in
   SPR. Replace any of them with an image through SPRITE_FILES (section 2).
   ============================================================================= */
const SPR = {};

// ---- Lowballer: grumpy brown briefcase --------------------------------------
function buildLowballer(frame) {
  const a = new PixelArt(20, 18, 1, 1);
  const L = '#3a2414', S = '#1d120a';
  if (frame === 0) { a.rect(4, 13, 2, 2, L); a.rect(12, 13, 2, 1, L); a.rect(3, 15, 3, 1, S); a.rect(12, 14, 3, 1, S); }
  else { a.rect(4, 13, 2, 1, L); a.rect(12, 13, 2, 2, L); a.rect(3, 14, 3, 1, S); a.rect(12, 15, 3, 1, S); }
  a.rect(6, 0, 6, 1, '#4a2a12'); a.rect(6, 1, 1, 2, '#4a2a12'); a.rect(11, 1, 1, 2, '#4a2a12'); // handle
  a.rect(1, 3, 16, 10, '#9a6232'); a.rect(1, 3, 16, 1, '#c08048'); a.rect(1, 12, 16, 1, '#6e4220');
  a.rect(8, 3, 2, 2, '#f2c14e');                               // clasp
  a.line(2, 5, 5, 6, S); a.line(15, 5, 12, 6, S);               // angry brows
  a.rect(3, 7, 3, 2, '#ffffff'); a.rect(12, 7, 3, 2, '#ffffff');
  a.set(3, 8, '#000000'); a.set(12, 8, '#000000');              // looking left
  a.rect(7, 10, 4, 1, S); a.set(6, 11, S); a.set(11, 11, S);    // frown
  return a.outline('#2a160a');
}
function buildLowballerFlat() {
  const a = new PixelArt(20, 8, 1, 1);
  a.rect(0, 1, 18, 5, '#9a6232'); a.rect(0, 1, 18, 1, '#c08048');
  a.set(4, 3, '#1d120a'); a.set(6, 3, '#1d120a'); a.set(5, 2, '#1d120a'); a.set(5, 4, '#1d120a');
  a.set(11, 3, '#1d120a'); a.set(13, 3, '#1d120a'); a.set(12, 2, '#1d120a'); a.set(12, 4, '#1d120a');
  return a.outline('#2a160a');
}

// ---- Red Tape: spiky roll (cannot be stomped) -------------------------------
function buildRedTape(rot) {
  const a = new PixelArt(22, 22), cx = 11, cy = 11;
  for (let i = 0; i < 8; i++) {
    const ang = rot + i * Math.PI / 4, ca = Math.cos(ang), sa = Math.sin(ang);
    for (let r = 5; r <= 10; r += 0.5) {
      const x = cx + ca * r, y = cy + sa * r;
      a.set(x, y, r > 9 ? '#ffffff' : '#d9e0ea');
      if (r < 8) a.set(x - sa, y + ca, '#b8c2d0');
    }
  }
  a.circle(cx, cy, 6.8, '#d8262e');
  a.recolor((x, y, c) => {
    if (c !== '#d8262e') return c;
    const d = Math.hypot(x + 0.5 - cx, y + 0.5 - cy);
    if (d > 4.4 && d < 5.4) return '#a3141c';
    if (x + y < 17 && d > 5.3) return '#ff6464';
    return c;
  });
  a.circle(cx, cy, 2.8, '#f2dfb0'); a.circle(cx, cy, 1.2, '#6b3a1a');
  return a.outline('#3a0a0e');
}

// ---- Coin (4-frame spin) ------------------------------------------------------
function buildCoin(f) {
  const a = new PixelArt(12, 14, 1, 1), rx = [4.5, 3.2, 1.0, 3.2][f];
  a.ellipse(5, 6, rx, 6, '#ffcc2e');
  if (f !== 2) {
    a.recolor((x, y, c) => (x + 0.5 < 5 - rx + 1.6) ? '#fff1a6' : ((x + 0.5 > 5 + rx - 1.6) ? '#e09b00' : c));
    if (f === 0) a.rect(5, 3, 1, 6, '#c98800');
  } else a.recolor(() => '#e0a400');
  return a.outline('#7a4800');
}

// ---- Blocks -------------------------------------------------------------------
function buildBlock(kind) {
  const a = new PixelArt(16, 16);
  const pal = {
    key:  ['#7a4a08', '#f2b632', '#ffe48a', '#b87414'],
    star: ['#7a4a08', '#f2b632', '#ffe48a', '#b87414'],
    used: ['#3e1e0c', '#a8693a', '#c88a58', '#7a4422'],
  };
  if (kind === 'brick') {
    a.rect(0, 0, 16, 16, '#5a240c');
    for (let r = 0; r < 4; r++) {
      const y = r * 4, off = (r % 2) * 4;
      for (let bx = -8 + off; bx < 16; bx += 8) {
        a.rect(bx + 1, y + 1, 7, 3, '#d0622a');
        a.rect(bx + 1, y + 1, 7, 1, '#f08a4a');
      }
    }
    return a;
  }
  const [o, base, hi, sh] = pal[kind] || pal.star;
  a.rect(0, 0, 16, 16, o); a.rect(1, 1, 14, 14, base);
  a.rect(1, 1, 14, 1, hi); a.rect(1, 1, 1, 14, hi);
  a.rect(1, 14, 14, 1, sh); a.rect(14, 1, 1, 14, sh);
  [[2, 2], [13, 2], [2, 13], [13, 13]].forEach(([x, y]) => a.set(x, y, o));
  if (kind === 'star' || kind === 'star_b') {   // gold ESPRO box with a star (Mario style)
    const pts = [];
    for (let i = 0; i < 10; i++) {
      const r = i % 2 ? 2.6 : 6, ang = -Math.PI / 2 + i * Math.PI / 5;
      pts.push([8 + Math.cos(ang) * r, 8.3 + Math.sin(ang) * r]);
    }
    a.poly(pts.map(([x, y]) => [x + 0.6, y + 0.8]), '#b87414');               // drop shadow
    a.poly(pts, kind === 'star' ? '#fff6c8' : '#ffffff');
    a.set(7, 6, '#ffffff'); a.set(8, 5, '#ffffff');
    return a;
  }
  if (kind === 'key') {   // gold brick with a key icon
    a.rect(1, 8, 14, 1, '#d89a22');
    const k = '#5a3208';
    a.rect(3, 5, 4, 5, k); a.rect(4, 6, 2, 3, base);     // ring
    a.rect(7, 7, 6, 2, k); a.rect(11, 9, 1, 2, k); a.rect(9, 9, 1, 1, k); // shaft + teeth
  }
  return a;
}

// ---- Power-ups ----------------------------------------------------------------
function buildPowerup(type) {
  const a = new PixelArt(16, 16);
  if (type === 'espresso') {
    a.rect(1, 13, 14, 2, '#f2f2f8'); a.rect(1, 14, 14, 1, '#c0c4d0');     // saucer
    a.rect(3, 6, 9, 6, '#e23b3b'); a.rect(4, 12, 7, 1, '#e23b3b');        // cup
    a.rect(10, 7, 2, 5, '#b02424');
    a.rect(12, 7, 2, 1, '#e23b3b'); a.rect(13, 8, 1, 2, '#e23b3b'); a.rect(12, 10, 2, 1, '#e23b3b');
    a.rect(3, 6, 9, 1, '#5a2e14'); a.rect(4, 6, 3, 1, '#c88a4a');          // coffee + crema
    a.rect(4, 8, 1, 3, '#ff8a7a');
    a.outline('#2a0c0c');
    ['#ffffff', '#e8eef8'].forEach((col, i) => { a.set(5 + i * 3, 1 + i, col); a.set(6 + i * 3, 2 + i, col); a.set(5 + i * 3, 3 + i, col); });
  } else if (type === 'key') {
    a.circle(5, 8, 3.6, '#ffd23f'); a.rect(4, 7, 2, 2, null);
    a.rect(8, 7, 7, 2, '#ffd23f'); a.rect(12, 9, 1, 2, '#ffd23f'); a.rect(14, 9, 1, 3, '#ffd23f');
    a.set(3, 6, '#fff6c0'); a.rect(9, 7, 5, 1, '#fff0a0');
    a.outline('#7a4a00');
  } else if (type === 'cash') {     // money bag: "SOLD OVER ASKING PRICE"
    a.poly([[4, 1], [7, 3], [9, 3], [12, 1], [11, 4], [5, 4]], '#3e9e48');       // bag top flaps
    a.ellipse(8, 10.5, 6.6, 5.2, '#3e9e48');                                      // bag body
    a.rect(6, 4, 5, 2, '#3e9e48');
    a.recolor((x, y, c) => (c === '#3e9e48' && x >= 10 && y >= 9) ? '#2c7a36' : c);
    a.set(4, 8, '#8ee07a'); a.set(4, 9, '#8ee07a'); a.set(5, 7, '#8ee07a');
    a.rect(5, 4, 7, 1, '#f2c14e');                                                 // gold tie
    const d = '#ffe066';                                                           // $ sign
    a.rect(8, 6, 1, 9, d); a.rect(7, 7, 3, 1, d); a.set(6, 8, d); a.set(6, 9, d); a.rect(7, 10, 2, 1, d);
    a.set(9, 11, d); a.set(10, 12, d); a.rect(7, 13, 3, 1, d); a.set(6, 12, d);
    a.outline('#123a18');
  } else if (type === 'heart') {
    a.circle(4.5, 5, 3.6, '#ff3b5c'); a.circle(10.5, 5, 3.6, '#ff3b5c');

// Load the embedded art, then any SPRITE_FILES overrides. Resolves when done.
function loadImages() {
  const jobs = [];
  const load = (key, url) => jobs.push(new Promise(res => {
    const img = new Image();
    img.onload = () => { img.lw = img.naturalWidth / CFG.ART_SCALE; img.lh = img.naturalHeight / CFG.ART_SCALE; SPR[key] = img; res(); };
    img.onerror = () => { console.warn('Sold Raptor: could not load sprite "' + key + '" from ' + String(url).slice(0, 60)); res(); };
    img.src = url;
  }));
  for (const [k, url] of Object.entries(EMBEDDED_SPRITES)) if (!SPRITE_FILES[k]) load(k, url);
  for (const [k, url] of Object.entries(SPRITE_FILES)) if (url) load(k, url);
  return Promise.all(jobs).then(() => {
    // mirrored copies give the scenery more variety
    for (const k of ['palms', 'palm_small', 'fern']) if (SPR[k]) SPR[k + '_flip'] = flipped(SPR[k]);
    if (SPR.house_0 && !SPR.house_0b) SPR.house_0b = SPR.house_0;
  });
}
function flipped(img) {
  const c = document.createElement('canvas'); c.width = img.naturalWidth || img.width; c.height = img.naturalHeight || img.height;
  const x = c.getContext('2d'); x.translate(c.width, 0); x.scale(-1, 1); x.drawImage(img, 0, 0);
  c.lw = iw(img); c.lh = ih(img); return c;
}
// Size of a sprite in game units (art images are drawn at 1/ART_SCALE of their pixels).
const iw = img => img.lw || img.width, ih = img => img.lh || img.height;
// Snap to the real pixel grid of the canvas.
const rnd = v => Math.round(v * CFG.ART_SCALE) / CFG.ART_SCALE;
function drawSpr(img, x, y) { ctx.drawImage(img, rnd(x), rnd(y), iw(img), ih(img)); }

/* == 6. Sound + music: 8-bit audio made live with Web Audio =========================
   Three volume buses: master (speaker button / M key), sound effects and music
   (both switchable in the pause menu). Nothing is loaded from files.
   ============================================================================= */
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
const Sound = {
  ctx: null, out: null, sfxBus: null, musicBus: null, noiseBuf: null,
  muted: false, sfxOn: true, musicOn: true,
  init() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.out = this.ctx.createGain(); this.out.connect(this.ctx.destination);
      this.sfxBus = this.ctx.createGain(); this.sfxBus.connect(this.out);
      this.musicBus = this.ctx.createGain(); this.musicBus.connect(this.out);
      const len = this.ctx.sampleRate; this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.noiseBuf.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.apply(true);
    }
    if (this.ctx.state === 'suspended' && !game.paused) this.ctx.resume();
    Music.start();
  },
  apply(now) {                  // push the on/off settings into the volume buses
    if (!this.ctx) return;
    const t = this.ctx.currentTime, k = now ? 0.001 : 0.03;
    this.out.gain.setTargetAtTime(this.muted ? 0 : 1, t, k);
    this.sfxBus.gain.setTargetAtTime(this.sfxOn ? 0.22 : 0, t, k);
    this.musicBus.gain.setTargetAtTime(this.musicOn ? 0.11 : 0, t, k);
  },
  note(f0, f1, t, dur, type, vol, dest) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.05);
  },
  noiseAt(t, dur, vol, freq, dest, type = 'lowpass') {
    const c = this.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noiseBuf; f.type = type; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(dest); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  },
  tone(f0, f1, dur, type = 'square', vol = 0.3, delay = 0) { this.note(f0, f1, this.ctx.currentTime + delay, dur, type, vol, this.sfxBus); },
  noise(dur, vol = 0.3, delay = 0, freq = 2000, type) { this.noiseAt(this.ctx.currentTime + delay, dur, vol, freq, this.sfxBus, type); },
  arp(notes, step, dur, type = 'square', vol = 0.15) { notes.forEach((n, i) => this.tone(n, n, dur, type, vol, i * step)); },
  play(name) {
    if (!this.ctx || this.muted || !this.sfxOn || this.ctx.state !== 'running') return;
    switch (name) {
      case 'jump':   this.tone(260, 620, 0.14, 'square', 0.16); break;
      case 'land':   this.tone(140, 60, 0.09, 'triangle', 0.35); this.noise(0.05, 0.12, 0, 600); break;
      case 'coin':   this.tone(988, 988, 0.06, 'square', 0.13); this.tone(1319, 1319, 0.2, 'square', 0.13, 0.06); break;
      case 'bump':   this.tone(150, 70, 0.1, 'triangle', 0.45); this.noise(0.06, 0.15, 0, 900); break;
      case 'appear': this.arp([523, 659, 784, 1047], 0.05, 0.07, 'square', 0.1); break;
      case 'power':  this.arp([392, 523, 659, 784, 1047, 1319], 0.06, 0.1, 'square', 0.13); break;
      case 'espro':  this.arp([523, 659, 784, 1047, 1319, 1568, 2093], 0.045, 0.12, 'square', 0.12);
                     this.tone(2093, 2093, 0.35, 'triangle', 0.12, 0.33); break;
      case 'cash':   this.noise(0.04, 0.3, 0, 6000); this.tone(2093, 2093, 0.5, 'sine', 0.28, 0.05);         // cha-
                     this.tone(2637, 2637, 0.7, 'sine', 0.24, 0.14); this.noise(0.18, 0.1, 0.14, 8000, 'highpass'); break; // -ching
      case 'powerdown': this.arp([784, 659, 523, 392], 0.07, 0.09, 'square', 0.12); break;
      case 'oneup':  this.arp([659, 784, 1319, 1047, 1175, 1568], 0.08, 0.1, 'square', 0.13); break;
      case 'best':   this.arp([784, 988, 1175, 1568], 0.07, 0.12, 'square', 0.13); break;
      case 'chomp':  this.noise(0.12, 0.45, 0, 1400); this.tone(240, 50, 0.18, 'sawtooth', 0.25);
                     this.noise(0.1, 0.35, 0.1, 900); this.tone(160, 60, 0.12, 'square', 0.15, 0.1); break;
      case 'pop':    this.tone(300, 900, 0.12, 'sine', 0.4); this.tone(900, 1300, 0.06, 'square', 0.08, 0.1); this.noise(0.08, 0.15, 0, 3000); break;
      case 'stomp':  this.tone(420, 90, 0.12, 'square', 0.25); this.noise(0.05, 0.15, 0, 1500); break;
      case 'hit':    this.tone(440, 110, 0.35, 'sawtooth', 0.22); this.tone(330, 80, 0.35, 'square', 0.12, 0.02); break;
      case 'fall':   this.tone(900, 120, 0.7, 'square', 0.12); break;
      case 'level':  this.arp([523, 659, 784, 659, 784, 1047], 0.07, 0.09, 'square', 0.12); break;
      case 'click':  this.tone(660, 660, 0.05, 'square', 0.12); break;
      case 'over':   this.arp([523, 392, 330, 262, 196], 0.18, 0.22, 'triangle', 0.3); break;
    }
  },
};

// ---- Soundtrack: an original 8-bar chiptune loop (lead, bass, drums) -------------
// Chords: C  Am  F  G | F  G  Em  Am. It speeds up during ESPRO (lead jumps an octave)
// and adds a sparkly arpeggio while the money bag makes you invincible.
const CHORDS = [[36, [60, 64, 67, 72]], [45, [57, 60, 64, 69]], [41, [53, 57, 60, 65]], [43, [55, 59, 62, 67]],
                [41, [53, 57, 60, 65]], [43, [55, 59, 62, 67]], [40, [52, 55, 59, 64]], [45, [57, 60, 64, 69]]];
const LEAD = [                       // one row per bar, eighth notes, 0 = rest
  [72, 0, 76, 79, 76, 0, 72, 74], [76, 0, 72, 69, 72, 0, 76, 77], [77, 0, 81, 77, 76, 0, 74, 72], [74, 74, 79, 0, 74, 71, 74, 0],
  [81, 0, 79, 77, 79, 0, 81, 0], [79, 0, 77, 74, 71, 0, 74, 79], [76, 0, 79, 83, 79, 0, 76, 74], [72, 0, 74, 76, 79, 0, 83, 0],
];
const Music = {
  step: 0, next: 0, timer: null,
  start() {
    if (this.timer || !Sound.ctx || game.mode === 'over') return;
    this.step = 0; this.next = Sound.ctx.currentTime + 0.08;
    this.timer = setInterval(() => this.tick(), 25);
  },
  stop() { clearInterval(this.timer); this.timer = null; },
  tick() {                           // schedule notes a little ahead of time so they never stutter
    const c = Sound.ctx;
    if (!c || c.state !== 'running') return;
    if (this.next < c.currentTime - 0.2) this.next = c.currentTime + 0.05;   // after a pause
    const pw = game.power && game.mode === 'play' ? game.power.type : null;
    const bpm = game.mode === 'title' ? 132 : (pw === 'espresso' ? 188 : 150);
    const sd = 60 / bpm / 4;
    while (this.next < c.currentTime + 0.12) {
      this.playStep(this.step, this.next, sd, pw);
      this.next += sd; this.step = (this.step + 1) % 128;
    }
  },
  playStep(s, t, sd, pw) {
    const bar = s >> 4, i = s & 15, B = Sound.musicBus, [root, tones] = CHORDS[bar];
    if (i % 8 === 0) Sound.note(150, 45, t, 0.12, 'sine', 0.9, B);                     // kick
    if (i % 8 === 4) Sound.noiseAt(t, 0.09, 0.45, 2500, B);                              // snare
    if (i % 2 === 0) Sound.noiseAt(t, 0.025, 0.16, 8000, B, 'highpass');                 // hi-hat
    if (i % 2 === 0) Sound.note(midi(root + ((i >> 1) % 2 ? 12 : 0)), 0, t, sd * 1.8, 'triangle', 0.9, B);   // bass
    const n = i % 2 === 0 ? LEAD[bar][i >> 1] : 0;
    if (n) Sound.note(midi(n + (pw === 'espresso' ? 12 : 0)), 0, t, sd * 1.7, 'square', 0.32, B);        // lead
    if (pw === 'cash') Sound.note(midi(tones[i % 4] + 24), 0, t, sd * 0.9, 'square', 0.12, B);           // sparkle
  },
};

};
Sound.muted = store.get('soldRaptorMuted', '0') === '1';
Sound.musicOn = store.get('soldRaptorMusic', '1') === '1';
Sound.sfxOn = store.get('soldRaptorSfx', '1') === '1';

const playerX = () => game.scroll + W / 2;
const level = () => Math.floor(game.houses / CFG.HOUSES_PER_LEVEL);
function newPlayer() {
  return { y: GROUND_Y, vy: 0, prevY: GROUND_Y, grounded: true, coyote: 0, jumpBuf: 0, jumping: false,
           animT: 0, chompT: 0, hurtT: 0, puffT: 0 };
}
function playerBox() { const x = playerX(), p = game.player; return { l: x + RAPTOR.hitL, r: x + RAPTOR.hitR, t: p.y - PH, b: p.y }; }
const overlap = (a, b) => a.l < b.r && a.r > b.l && a.t < b.b && a.b > b.t;
function overGap(x, half = 6) { return game.gaps.some(g => x - half >= g.x1 && x + half <= g.x2); }

// ---- Object factories used by chunks ----------------------------------------
function addCoin(x, y) { game.coinList.push({ x, y }); }
function coinLine(x, y, n, dx) { for (let i = 0; i < n; i++) addCoin(x + i * dx, y); }
function coinArc(x, baseY, n, dx, h) { for (let i = 0; i < n; i++) addCoin(x + i * dx, baseY - Math.sin(i / (n - 1) * Math.PI) * h); }
function addBlock(x, y, kind) {
  game.blocks.push({ x, y, kind, content: kind === 'key' ? (Math.random() < 0.4 ? 'power' : 'coin') : null, bumpT: 0 });
}
const brick = (x, y) => addBlock(x, y, 'brick');
const keyBlock = (x, y) => addBlock(x, y, 'key');
const starBlock = (x, y) => addBlock(x, y, 'star');     // always holds an ESPRO
function addEnemy(kind, x) {
  game.enemies.push({ kind, x, y: GROUND_Y, vx: kind === 'low' ? -22 : -50, vy: 0, t: Math.random(), state: 'walk', timer: 0, falling: false });
}
function addGap(x, w) { game.gaps.push({ x1: x, x2: x + w }); }
function addHouse(x) {
  if (!game.houseBag.length) game.houseBag = [0, 1, 2, 3].sort(() => Math.random() - 0.5);
  game.houseList.push({ x, kind: game.houseBag.pop(), eaten: false, eatT: 0 });
}

// ---- Hand-designed chunks. Each places objects from x and returns its length.
const CHUNKS = {
  coinRow(x)   { coinLine(x + 30, GROUND_Y - 22, 6, 16); return 170; },
  coinArc(x)   { coinArc(x + 30, GROUND_Y - 30, 7, 18, 60); return 190; },
  keyRow(x)    {
    brick(x + 40, ROW_TOP); keyBlock(x + 56, ROW_TOP); brick(x + 72, ROW_TOP);
    (Math.random() < 0.35 ? starBlock : keyBlock)(x + 88, ROW_TOP); brick(x + 104, ROW_TOP);
    coinLine(x + 48, ROW_TOP - 12, 5, 16); return 190;
  },
  singleKey(x) { keyBlock(x + 50, ROW_TOP); coinLine(x + 100, GROUND_Y - 22, 3, 16); return 160; },
  espro(x)     { brick(x + 40, ROW_TOP); starBlock(x + 56, ROW_TOP); brick(x + 72, ROW_TOP); coinArc(x + 100, GROUND_Y - 26, 4, 16, 24); return 180; },
  platforms(x, L) {          // low ledge, then a high ledge you can only reach from it
    for (let i = 0; i < 5; i++) brick(x + 30 + i * 16, PLAT_TOP);
    coinLine(x + 38, PLAT_TOP - 14, 5, 16);
    for (let i = 0; i < 4; i++) brick(x + 130 + i * 16, PLAT2_TOP);
    keyBlock(x + 146, PLAT2_TOP - 64);
    coinLine(x + 138, PLAT2_TOP - 14, 4, 16);
    if (L >= 1) addEnemy('low', x + 120);
    return 260;
  },
  steps(x) {                 // a staircase of brick ledges
    for (let i = 0; i < 3; i++) brick(x + 30 + i * 16, PLAT_TOP);
    for (let i = 0; i < 3; i++) brick(x + 100 + i * 16, PLAT2_TOP);
    for (let i = 0; i < 3; i++) brick(x + 170 + i * 16, PLAT_TOP);
    coinArc(x + 100, PLAT2_TOP - 14, 3, 16, 10);
    return 260;
  },
  enemies(x, L) {
    const n = 1 + Math.floor(Math.random() * (1 + Math.min(3, L)));
    for (let i = 0; i < n; i++) addEnemy('low', x + 60 + i * 50);
    coinLine(x + 50, GROUND_Y - 72, n * 3, 16);
    return 110 + n * 50;
  },
  enemyBlocks(x) { keyBlock(x + 40, ROW_TOP); brick(x + 56, ROW_TOP); keyBlock(x + 72, ROW_TOP); addEnemy('low', x + 140); return 200; },
  redTape(x, L) {
    addEnemy('tape', x + 80); coinArc(x + 45, GROUND_Y - 40, 5, 18, 55);
    if (L >= 3 && Math.random() < 0.5) { addEnemy('tape', x + 210); return 290; }
    return 200;
  },
  gap(x, L) {
    const w = (L >= 2 && Math.random() < 0.5) ? 48 : 32;
    const gx = Math.ceil((x + 50) / 16) * 16;
    addGap(gx, w);
    coinArc(gx - 16, GROUND_Y - 34, 5, (w + 32) / 4, 50);
    return (gx - x) + w + 80;
  },
  house(x) { addHouse(x + 70); return 70 + 36 + 190; },
};
function pickChunk(L) {
  const pool = [['coinRow', 2], ['coinArc', 3], ['keyRow', 3], ['singleKey', 2], ['platforms', 2.5], ['steps', 1.5], ['espro', 1.6],
                ['enemies', 3 + L], ['gap', 1.5 + L * 0.3], ['enemyBlocks', 2]];
  if (L >= 1) pool.push(['redTape', 1.5 + L * 0.5]);
  const opts = pool.filter(([n]) => !(n === game.lastChunk && (n === 'gap' || n === 'redTape')));
  let r = Math.random() * opts.reduce((s, o) => s + o[1], 0);
  for (const [n, w] of opts) { r -= w; if (r <= 0) return n; }
  return 'coinArc';
}
function spawnChunks() {
  while (game.nextChunkX < game.scroll + W + 64) {
    const L = level();
    const type = game.chunksSinceHouse >= 2 + (game.nextChunkX % 3 === 0 ? 1 : 0) ? 'house' : pickChunk(L);
    game.nextChunkX += CHUNKS[type](game.nextChunkX, L);
    game.chunksSinceHouse = type === 'house' ? 0 : game.chunksSinceHouse + 1;
    game.lastChunk = type;
  }
}

function startGame() {
  Object.assign(game, {
    mode: 'play', score: 0, coins: 0, houses: 0, hearts: CFG.START_HEARTS, power: null, paused: false,
    blocks: [], coinList: [], enemies: [], powerups: [], houseList: [], signs: [], texts: [], gaps: [], pendingSigns: [],
    speed: CFG.BASE_SPEED, chunksSinceHouse: 1, lastChunk: '', newBest: false, shake: 0,
  });
  game.player = newPlayer();
  game.nextChunkX = game.scroll + W + 20;
  Music.start();
  coinLine(playerX() + 90, GROUND_Y - 22, 5, 16);
}
function gameOver() {
  game.mode = 'over'; game.overT = 0;
  if (game.score >= game.best) { game.best = game.score; store.set('soldRaptorBest', String(game.best)); }
  Music.stop();
  Sound.play('over');
}

/* == 8. Update ================================================================ */
function addScore(n) {
  game.score += n * (game.power && game.power.type === 'espresso' ? 2 : 1);
  if (game.mode === 'play' && game.score > game.best) {     // best score is saved the moment you beat it
    if (!game.newBest && game.best > 0) { addText('NEW BEST!', playerX(), game.player.y - 95, '#7dff8a', 2); Sound.play('best'); }
    game.newBest = true; game.best = game.score; store.set('soldRaptorBest', String(game.best));
  }
}
function addText(str, x, y, color = '#ffffff', s = 1) { game.texts.push({ str, x, y, color, s, life: 0.9 }); }
function addParticle(p) { game.particles.push(Object.assign({ vx: 0, vy: 0, g: 0, life: 0.5, max: 0.5, size: 2 }, p)); }
function puff(x, y, n = 3, spread = 10) {
  for (let i = 0; i < n; i++) addParticle({ type: 'puff', x: x + (Math.random() - 0.5) * spread, y: y - Math.random() * 4,
    vx: (Math.random() - 0.5) * 30, vy: -10 - Math.random() * 20, life: 0.45, max: 0.45 });
}

function collectCoin() {
  game.coins++; addScore(10); Sound.play('coin');
  if (game.coins % 100 === 0) {
    if (game.hearts < CFG.MAX_HEARTS) game.hearts++;
    addText('1UP!', playerX(), game.player.y - 75, '#7dff8a', 2); Sound.play('oneup');
  }
}

function hurt(fromFall) {
  const p = game.player;
  if (!fromFall) {
    if (p.hurtT > 0 || (game.power && game.power.type === 'cash')) return;
    if (game.power) {           // lose the power-up instead of a heart
      game.power = null; p.hurtT = CFG.HURT_TIME; game.shake = 0.25; Sound.play('hit');
      addText('POWER LOST', playerX(), p.y - 75, '#ffb0b0'); return;
    }
  }
  game.hearts--; p.hurtT = CFG.HURT_TIME; game.shake = 0.35; Sound.play('hit');
  if (game.hearts <= 0) gameOver();
}

function fellInGap() {
  Sound.play('fall');
  hurt(true);
  if (game.mode !== 'play') return;
  const x = playerX(), p = game.player;
  game.gaps = game.gaps.filter(g => g.x2 < x - 120 || g.x1 > x + 120);       // patch the hole
  game.enemies = game.enemies.filter(e => Math.abs(e.x - x) > 110);
  p.y = GROUND_Y - 90; p.prevY = p.y; p.vy = 0; p.grounded = false;
}

function hitBlock(b) {
  b.bumpT = 0.15; Sound.play('bump');
  // Coins resting on the block get knocked loose and collected
  game.coinList = game.coinList.filter(c => {
    if (Math.abs(c.x - (b.x + 8)) < 11 && c.y < b.y && c.y > b.y - 22) { collectCoin(); return false; }
    return true;
  });
  if (b.kind === 'star') {
    b.kind = 'used';
    game.powerups.push({ type: 'espresso', x: b.x + 8, y: b.y + 16, baseY: b.y, vy: 0, dir: 45, state: 'emerge', t: 0, life: 14 });
    Sound.play('appear');
    return;
  }
  if (b.kind !== 'key') return;
  b.kind = 'used';
  if (b.content === 'coin') {
    collectCoin();
    addParticle({ type: 'coin', x: b.x + 8, y: b.y - 6, vy: -230, g: 750, life: 0.45, max: 0.45 });
  } else {
    let types = ['key', 'key', 'cash', 'cash', 'heart', 'heart', 'espresso'];
    if (game.hearts >= CFG.MAX_HEARTS) types = types.filter(t => t !== 'heart');
    const type = types[Math.floor(Math.random() * types.length)];
    game.powerups.push({ type, x: b.x + 8, y: b.y + 16, baseY: b.y, vy: 0, dir: 45, state: 'emerge', t: 0, life: 14 });
    Sound.play('appear');
  }
}

function applyPower(type) {
  const x = playerX(), y = game.player.y - 75;
  if (type === 'heart') {
    game.hearts = Math.min(CFG.MAX_HEARTS, game.hearts + 1);
    addText('+1 HEART', x, y, '#ff8aa0'); Sound.play('oneup'); return;
  }
  game.power = { type, t: CFG.POWER_TIME[type], dur: CFG.POWER_TIME[type] };
  if (type === 'cash') addText('SOLD OVER ASKING PRICE!', x, y - 10, '#5dff7a', 2);
  else addText({ espresso: 'ESPRO! 2X', key: 'COIN MAGNET!' }[type], x, y, type === 'espresso' ? '#ff8ad8' : '#ffe066');
  if (type === 'espresso') for (let i = 0; i < 16; i++) addParticle({ type: 'sparkle', x: x + (Math.random() - 0.5) * 70, y: y + 20 + Math.random() * 50, vy: -30, life: 0.6, max: 0.6 });
  Sound.play(type === 'espresso' ? 'espro' : type === 'cash' ? 'cash' : 'power');
}

function updatePlayer(dt) {
  const p = game.player, x = playerX();
  p.animT += dt * game.speed / 80;
  if (p.chompT > 0) p.chompT -= dt;
  if (p.hurtT > 0) p.hurtT -= dt;
  if (p.jumpBuf > 0) p.jumpBuf -= dt;
  if (p.coyote > 0) p.coyote -= dt;

  // Jump (buffered press + coyote time)
  if (p.jumpBuf > 0 && (p.grounded || p.coyote > 0)) {
    p.vy = -CFG.JUMP_V; p.grounded = false; p.coyote = 0; p.jumpBuf = 0; p.jumping = true;
    Sound.play('jump'); puff(x + RAPTOR.feet[0], p.y, 2, 8); puff(x + RAPTOR.feet[1], p.y, 2, 8);
  }
  // Variable height: let go early = short hop
  if (p.jumping && !input.holding && p.vy < -CFG.JUMP_CUT) p.vy = -CFG.JUMP_CUT;
  if (p.vy >= 0) p.jumping = false;

  const g = (input.holding && p.vy < 0) ? CFG.GRAVITY_UP : CFG.GRAVITY_DOWN;
  p.vy = Math.min(CFG.MAX_FALL, p.vy + g * dt);
  p.prevY = p.y;
  const prevTop = p.y - PH;
  p.y += p.vy * dt;
  const fallSpeed = p.vy;
  const wasGrounded = p.grounded;
  p.grounded = false;

  // Ground (unless over a gap)
  if (!overGap(x, 10) && p.vy >= 0 && p.y >= GROUND_Y && p.prevY <= GROUND_Y + 2) { p.y = GROUND_Y; p.vy = 0; p.grounded = true; }

  // Blocks: land on top / bump from below. Side contact is ignored (the world scrolls into you).
  const box = playerBox();
  let bump = null, bestD = 1e9;
  for (const b of game.blocks) {
    if (b.x >= box.r || b.x + 16 <= box.l) continue;
    if (p.vy >= 0 && p.prevY <= b.y + 0.5 && p.y >= b.y) { p.y = b.y; p.vy = 0; p.grounded = true; }
    else if (p.vy < 0 && prevTop >= b.y + 15.5 && p.y - PH < b.y + 16) {
      const d = Math.abs(b.x + 8 - (x + RAPTOR.headX)); if (d < bestD) { bestD = d; bump = b; }
    }
  }
  if (bump) { p.y = bump.y + 16 + PH; p.vy = 60; p.jumping = false; hitBlock(bump); }

  if (p.grounded && !wasGrounded && fallSpeed > 200) Sound.play('land');
  if (p.grounded && !wasGrounded) { puff(x + RAPTOR.feet[0], p.y, 3, 18); puff(x + RAPTOR.feet[1], p.y, 3, 18); }                  // landing dust
  if (wasGrounded && !p.grounded && p.vy >= 0) p.coyote = CFG.COYOTE;       // ran off a ledge

  // Running dust at the feet
  if (p.grounded) {
    p.puffT -= dt;
    if (p.puffT <= 0) { p.puffT = 0.14; addParticle({ type: 'puff', x: x + RAPTOR.feet[Math.random() < 0.5 ? 0 : 1] + Math.random() * 10 - 5, y: p.y - 1, vy: -12, life: 0.35, max: 0.35 }); }
  }
  if (p.y > H + 70) fellInGap();
}

function updateObjects(dt) {
  const p = game.player, x = playerX(), box = playerBox();
  const star = game.power && game.power.type === 'cash';      // money bag: invincible

  for (const b of game.blocks) if (b.bumpT > 0) b.bumpT -= dt;

  // Coins (+ Golden Key magnet)
  const magnet = game.power && game.power.type === 'key';
  game.coinList = game.coinList.filter(c => {
    if (magnet) {
      const dx = x + 5 - c.x, dy = p.y - 30 - c.y, d = Math.hypot(dx, dy);
      if (d < CFG.MAGNET_RADIUS && d > 0.1) { const s = Math.min(d, (300 + game.speed) * dt); c.x += dx / d * s; c.y += dy / d * s; }
    }
    if (overlap(box, { l: c.x - 5, r: c.x + 5, t: c.y - 6, b: c.y + 6 })) {
      collectCoin();
      addParticle({ type: 'sparkle', x: c.x, y: c.y, life: 0.25, max: 0.25 });
      return false;
    }
    return true;
  });

  // Enemies
  game.enemies = game.enemies.filter(e => {
    e.t += dt;
    if (e.state === 'squash') { e.timer -= dt; return e.timer > 0; }
    if (e.state === 'dead') { e.vy += 1200 * dt; e.y += e.vy * dt; e.x += e.vx * dt; return e.y < H + 40; }
    e.x += e.vx * dt;
    if (!e.falling && overGap(e.x, 4)) e.falling = true;
    if (e.falling) { e.vy += 1200 * dt; e.y += e.vy * dt; if (e.y > H + 40) return false; }
    const eh = e.kind === 'low' ? 15 : 17;
    const ebox = { l: e.x - 7, r: e.x + 7, t: e.y - eh, b: e.y };
    if (game.mode === 'play' && overlap(box, ebox)) {
      if (star) {                              // it just bounces off the raptor
        e.state = 'dead'; e.vy = -320; e.vx = 150; addScore(50); Sound.play('bump');
        puff(e.x, e.y - 8, 3, 10);
        addText('+50', e.x, e.y - 20, '#5dff7a');
      } else if (e.kind === 'low' && p.vy > 0 && p.prevY <= ebox.t + 10) {
        e.state = 'squash'; e.timer = 0.5;
        p.vy = -(input.holding ? CFG.STOMP_BOUNCE_HELD : CFG.STOMP_BOUNCE); p.jumping = true; p.grounded = false;
        addScore(50); Sound.play('stomp'); puff(e.x, e.y, 3, 14);
        addText('+50', e.x, e.y - 20, '#ffffff');
      } else hurt(false);
    }
    return true;
  });

  // Power-ups: rise out of the block, then slide along the ground toward the raptor
  game.powerups = game.powerups.filter(u => {
    u.t += dt; u.life -= dt;
    if (u.life <= 0) return false;
    if (u.state === 'emerge') {
      u.y = u.baseY + 16 - 16 * Math.min(1, u.t / 0.35);
      if (u.t >= 0.35) { u.state = 'move'; u.dir = (x > u.x ? 1 : -1) * 45; }
    } else {
      const prevY = u.y;
      u.vy = Math.min(500, u.vy + 900 * dt); u.y += u.vy * dt;
      u.x += (game.speed + u.dir) * dt;
      let grounded = false;
      if (!overGap(u.x, 4) && u.y >= GROUND_Y && prevY <= GROUND_Y + 2) { u.y = GROUND_Y; grounded = true; }
      for (const b of game.blocks) {
        if (u.x + 6 > b.x && u.x - 6 < b.x + 16 && u.vy >= 0 && prevY <= b.y + 0.5 && u.y >= b.y) { u.y = b.y; grounded = true; }
      }
      if (grounded) { u.vy = 0; if (Math.abs(x + 3 - u.x) > 4) u.dir = Math.sign(x + 3 - u.x) * 50; else u.dir = 0; }
      if (u.y > H + 30) return false;
    }
    if (game.mode === 'play' && u.state === 'move' && overlap(box, { l: u.x - 7, r: u.x + 7, t: u.y - 14, b: u.y })) {
      applyPower(u.type); return false;
    }
    return true;
  });

  // Houses: the raptor opens wide and swallows them whole
  const mouthX = x + RAPTOR.mouth[0];
  game.houseList = game.houseList.filter(h => {
    if (h.eaten) { h.eatT += dt; return h.eatT < 0.25; }
    if (game.mode !== 'play') return true;
    if (h.x - mouthX < 40) p.chompT = Math.max(p.chompT, 0.1);
    if (h.x <= mouthX - 4) eatHouse(h);
    return true;
  });
  game.pendingSigns = game.pendingSigns.filter(s => { s.t -= dt; if (s.t <= 0) { spawnSign(); return false; } return true; });

  // SOLD signs: fly out the back, land in the grass, scroll away
  for (const s of game.signs) {
    if (s.squash > 0) s.squash -= dt;
    if (s.planted) continue;
    s.vy += 900 * dt; s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.vy > 0 && s.y >= GROUND_Y + 2 && !overGap(s.x, 2)) {
      s.y = GROUND_Y + 2; s.planted = true; s.squash = 0.18; puff(s.x, GROUND_Y, 3, 16);
    }
  }
}

function eatHouse(h) {
  const p = game.player;
  h.eaten = true; h.eatT = 0; h.sx0 = h.x - game.scroll; h.sy0 = GROUND_Y + 2 - ih(SPR['house_' + h.kind]);
  p.chompT = 0.3;
  game.houses++; addScore(100); Sound.play('chomp');
  game.shake = Math.max(game.shake, 0.12);
  const mx = playerX() + RAPTOR.mouth[0], my = p.y + RAPTOR.mouth[1];
  for (let i = 0; i < 14; i++) {
    const cols = HOUSE_CRUMBS[h.kind];
    addParticle({ type: 'px', x: mx + Math.random() * 10, y: my + Math.random() * 10 - 5, vx: (Math.random() - 0.3) * 140,
      vy: -60 - Math.random() * 140, g: 600, life: 0.6, max: 0.6, size: 2, color: cols[i % cols.length] });
  }
  addText('+100', mx, my - 22, '#ffe066', 2);
  game.pendingSigns.push({ t: 0.5 });
  if (game.houses % CFG.HOUSES_PER_LEVEL === 0) { addText('SPEED UP!', playerX(), 70, '#7dffea', 2); Sound.play('level'); }
}

function spawnSign() {
  if (game.mode !== 'play') return;
  const p = game.player, x = playerX() + RAPTOR.rear[0], y = p.y + RAPTOR.rear[1];
  game.signs.push({ x, y: y + 16, vx: game.speed * 0.35, vy: -260, planted: false, squash: 0 });
  puff(x, y, 6, 14); Sound.play('pop');
  addText('SOLD!', x, y - 26, '#ff5a5a', 2);
}

function updateEffects(dt) {
  game.particles = game.particles.filter(q => {
    q.life -= dt; q.vy += q.g * dt; q.x += q.vx * dt; q.y += q.vy * dt;
    if (q.type === 'coin' && q.life <= 0) addParticle({ type: 'sparkle', x: q.x, y: q.y, life: 0.2, max: 0.2 });
    return q.life > 0;
  });
  game.texts = game.texts.filter(t => { t.life -= dt; t.y -= 26 * dt; return t.life > 0; });
}

function cull() {
  const left = game.scroll - 200;
  game.blocks = game.blocks.filter(b => b.x > left);
  game.coinList = game.coinList.filter(c => c.x > left);
  game.enemies = game.enemies.filter(e => e.x > left);
  game.signs = game.signs.filter(s => s.x > left);
  game.powerups = game.powerups.filter(u => u.x > left && u.x < game.scroll + W + 200);
  game.gaps = game.gaps.filter(g => g.x2 > left);
}

function update(dt) {
  game.t += dt;
  if (game.shake > 0) game.shake -= dt;
  // Vertical camera: pans up to follow high jumps, otherwise frames the scene like the references
  const camTarget = (game.mode === 'play' && game.player) ? Math.min(0, game.player.y - PH - CFG.CAMERA_TOP) : 0;
  game.camY += (camTarget - game.camY) * Math.min(1, dt * 8);
  if (game.mode === 'title') {
    game.scroll += 80 * dt; game.player.animT += dt * 0.7; updateEffects(dt); return;
  }
  if (game.mode === 'over') {
    game.overT += dt; game.scroll += 60 * dt; updateEffects(dt); return;
  }
  if (game.paused) return;
  const target = Math.min(CFG.MAX_SPEED, CFG.BASE_SPEED + CFG.SPEED_STEP * level()) *
                 (game.power && game.power.type === 'espresso' ? CFG.ESPRESSO_SPEED_MULT : 1);
  game.speed += (target - game.speed) * Math.min(1, dt * 2);
  game.scroll += game.speed * dt;
  spawnChunks();
  updatePlayer(dt);
  if (game.mode !== 'play') return;
  updateObjects(dt);
  updateEffects(dt);
  if (game.power) { game.power.t -= dt; if (game.power.t <= 0) { game.power = null; Sound.play('powerdown'); } }
  cull();
}

/* == 9. Render ================================================================= */
const textCache = new Map();
function textCanvas(str, s, color, outline) {
  const key = str + '|' + s + '|' + color + '|' + outline;
  let cv = textCache.get(key);
  if (cv) return cv;
  if (textCache.size > 400) textCache.clear();
  const w = Math.max(1, str.length * 4 * s - s), h = 5 * s;
  cv = document.createElement('canvas'); cv.width = w + 3; cv.height = h + 4;
  const c = cv.getContext('2d');
  const paint = (ox, oy, col) => {
    for (let i = 0; i < str.length; i++) {
      const g = FONT[str[i]] || FONT['?'];
      for (let r = 0; r < 5; r++) {
        c.fillStyle = Array.isArray(col) ? col[r] : col;
        for (let k = 0; k < 3; k++) if (g[r * 3 + k] === '1') c.fillRect(ox + i * 4 * s + k * s, oy + r * s, s, s);
      }
    }
  };
  if (outline) {
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 2; dy++) if (dx || dy) paint(1 + dx, 1 + dy, outline);
    paint(1, 3, outline);
  }
  paint(1, 1, color);
  textCache.set(key, cv);
  return cv;
}
function drawText(str, x, y, s = 1, color = '#ffffff', align = 'left', outline = '#1a0f2e') {
  str = String(str).toUpperCase();
  const w = str.length * 4 * s - s;
  if (align === 'center') x -= w / 2; else if (align === 'right') x -= w;
  ctx.drawImage(textCanvas(str, s, color, outline), Math.round(x) - 1, Math.round(y) - 1);
}

function buildSky() {
  skyCanvas = document.createElement('canvas'); skyCanvas.width = W; skyCanvas.height = H;
  const c = skyCanvas.getContext('2d');
  const cols = ['#3ca3fc', '#3ea5fd', '#40a6fd', '#43a9fe', '#47acfd', '#4bb0fe', '#55b6fe'];  // sampled from the references
  const bh = Math.ceil(GROUND_TOP / cols.length);
  cols.forEach((col, i) => { c.fillStyle = col; c.fillRect(0, i * bh, W, bh + 1); });
  for (let i = 1; i < cols.length; i++) {      // dithered band edges, SNES style
    c.fillStyle = cols[i - 1];
    for (let x = 0; x < W; x++) { if (x % 2 === 0) c.fillRect(x, i * bh, 1, 1); if (x % 4 === 0) c.fillRect(x + 1, i * bh + 1, 1, 1); }
  }
  c.fillStyle = cols[cols.length - 1]; c.fillRect(0, GROUND_TOP, W, H - GROUND_TOP);
}

function tileLayer(img, f, y) {
  const w = iw(img), off = -((game.scroll * f) % w);
  for (let x = off; x < W; x += w) drawSpr(img, x, y);
}
function drawProps(keys, f, spacing, jitter, bottom, seed, skip) {
  const off = game.scroll * f;
  const i0 = Math.floor((off - 90) / spacing) - 1, i1 = Math.floor((off + W) / spacing) + 1;
  for (let i = i0; i <= i1; i++) {
    if (hash(i * 3 + seed) < skip) continue;
    const img = SPR[keys[Math.floor(hash(i * 7 + seed) * keys.length)]];
    drawSpr(img, i * spacing + hash(i * 11 + seed) * jitter - off, bottom - ih(img));
  }
}

function drawBackground() {
  const P = CFG.PARALLAX;
  if (SPR.sky) ctx.drawImage(SPR.sky, 0, 0, W, GROUND_TOP); else ctx.drawImage(skyCanvas, 0, 0);
  // Clouds (slowest layer; they also drift on their own)
  const cs = game.scroll * P.clouds + game.t * 3, sp = 140;
  for (let i = Math.floor((cs - 80) / sp); i <= Math.floor((cs + W) / sp) + 1; i++) {
    const img = SPR['cloud_' + Math.floor(hash(i) * 3)];
    drawSpr(img, i * sp + hash(i + 99) * 70 - cs, 34 + hash(i + 33) * 60 - game.camY * 0.1);
  }
  const bd = SPR.backdrop, bdTop = GROUND_TOP - ih(bd) + 1 - game.camY * 0.3;
  drawProps(['skyline'], P.skyline, 300, 90, bdTop + 9, 3, 0.25);           // city peeks over the mountains
  tileLayer(bd, P.backdrop, bdTop);                                          // mountains + forest hills
  drawProps(['palms', 'palms_flip', 'palm_small', 'palm_small_flip'], P.palms, 110, 70, GROUND_TOP + 2 - game.camY * 0.6, 5, 0.3);
}

function drawGround() {
  const tile = SPR.ground, tw = iw(tile), th = ih(tile), k = (tile.naturalWidth || tile.width) / tw;
  const c0 = Math.floor(game.scroll / 16), c1 = Math.floor((game.scroll + W) / 16) + 1;
  for (let col = c0; col <= c1; col++) {
    const wx = col * 16;
    if (overGap(wx + 8, 0)) continue;
    const dx = rnd(wx - game.scroll);
    let sx = ((wx % tw) + tw) % tw, done = 0;
    while (done < 16) {                         // copy a 16px column slice of the repeating ground tile
      const w = Math.min(16 - done, tw - sx);
      ctx.drawImage(tile, sx * k, 0, w * k, th * k, dx + done, GROUND_TOP, w, th);
      done += w; sx = 0;
    }
  }
  ctx.fillStyle = '#3a1a08';
  for (const g of game.gaps) {
    const a = Math.round(g.x1 - game.scroll), b = Math.round(g.x2 - game.scroll);
    ctx.fillRect(a - 2, GROUND_TOP + 4, 2, H - GROUND_TOP); ctx.fillRect(b, GROUND_TOP + 4, 2, H - GROUND_TOP);
  }
  // Ferns sit on the back strip of grass, behind the raptor
  drawProps(['fern', 'fern_flip'], CFG.PARALLAX.ferns, 95, 60, GROUND_TOP + 4, 17, 0.4);
}

function drawBottomCenter(img, x, bottom) { drawSpr(img, x - iw(img) / 2, bottom - ih(img)); }

const tintCv = document.createElement('canvas'), tintCtx = tintCv.getContext('2d');
function drawTinted(img, x, y, color, alpha) {
  tintCv.width = img.naturalWidth || img.width; tintCv.height = img.naturalHeight || img.height;
  tintCtx.drawImage(img, 0, 0);
  tintCtx.globalCompositeOperation = 'source-atop'; tintCtx.globalAlpha = alpha;
  tintCtx.fillStyle = color; tintCtx.fillRect(0, 0, tintCv.width, tintCv.height);
  tintCtx.globalCompositeOperation = 'source-over'; tintCtx.globalAlpha = 1;
  ctx.drawImage(tintCv, x, y, iw(img), ih(img));
}

function drawWorld() {
  const S = game.scroll;
  for (const s of game.signs) {
    const img = SPR.sold_sign;
    if (s.squash > 0) {
      const w = iw(img) * 1.15, h = ih(img) * 0.85;
      ctx.drawImage(img, rnd(s.x - S - w / 2), rnd(s.y - h), rnd(w), rnd(h));
    } else drawBottomCenter(img, s.x - S, s.y);
  }
  for (const h of game.houseList) {
    const img = SPR['house_' + h.kind + (Math.floor(game.t * 3) % 2 ? 'b' : '')] || SPR['house_' + h.kind];  // twinkling lights
    if (!h.eaten) { drawSpr(img, h.x - S, GROUND_Y + 2 - ih(img)); continue; }
    const k = Math.min(1, h.eatT / 0.25), sc = 1 - k;           // shrink into the jaws
    const mx = W / 2 + RAPTOR.mouth[0], my = game.player.y + RAPTOR.mouth[1];
    const x = h.sx0 + (mx - h.sx0) * k, y = h.sy0 + (my - h.sy0) * k;
    if (sc > 0.02) ctx.drawImage(img, rnd(x), rnd(y), rnd(iw(img) * sc), rnd(ih(img) * sc));
  }
  for (const u of game.powerups) drawBottomCenter(SPR['pu_' + u.type], u.x - S, u.y + (u.state === 'move' ? Math.round(Math.sin(u.t * 10)) : 0));
  for (const b of game.blocks) {
    const dy = b.bumpT > 0 ? -Math.round(Math.sin((1 - b.bumpT / 0.15) * Math.PI) * 5) : 0;
    const bk = b.kind === 'star' && Math.floor(game.t * 3) % 3 === 0 ? 'star_b' : b.kind;
    ctx.drawImage(SPR['block_' + bk], Math.round(b.x - S), b.y + dy);
  }
  for (const c of game.coinList) {
    const img = SPR['coin_' + (Math.floor(game.t * 8 + c.x * 0.02) % 4)];
    ctx.drawImage(img, Math.round(c.x - S - img.width / 2), Math.round(c.y - img.height / 2));
  }
  for (const e of game.enemies) {
    const ex = e.x - S;
    if (e.kind === 'low') {
      if (e.state === 'squash') { drawBottomCenter(SPR.lowballer_flat, ex, e.y + 1); continue; }
      const img = SPR['lowballer_' + (Math.floor(e.t * 6) % 2)];
      if (e.state === 'dead') {
        ctx.save(); ctx.translate(Math.round(ex), Math.round(e.y - 8)); ctx.scale(1, -1);
        ctx.drawImage(img, -img.width / 2 | 0, -img.height / 2 | 0); ctx.restore();
      } else drawBottomCenter(img, ex, e.y + 1);
    } else {
      drawBottomCenter(SPR['redtape_' + (3 - Math.floor(e.t * 12) % 4)], ex, e.y + 1);
    }
  }
}

function drawPlayer() {
  const p = game.player;
  if (p.hurtT > 0 && Math.floor(p.hurtT * 12) % 2 === 0) return;      // invincibility flashing
  const espro = game.power && game.power.type === 'espresso';
  // Pose: 8-frame walk on the ground; rise / peak / fall in the air (tail and hair swing with it)
  let pose;
  if (!p.grounded && game.mode === 'play') pose = p.vy < -150 ? 'rise' : (p.vy > 150 ? 'fall' : 'peak');
  else pose = 'run_' + (Math.floor(p.animT * 19) % 12);     // 12-frame walk cycle
  const key = 'raptor_' + pose + (p.chompT > 0 ? '_open' : '') + (espro ? '_espro' : '');
  const img = SPR[key] || SPR['raptor_' + pose];
  const x = rnd(W / 2 - RAPTOR.anchorX), y = rnd(p.y + 1 - ih(img));
  if (game.power && game.power.type === 'cash') {   // money bag: pulsing green glow, invincible
    const ending = game.power.t < 1.5 && Math.floor(game.t * 8) % 2;
    const pulse = 0.5 + 0.5 * Math.sin(game.t * 12);
    ctx.save();
    ctx.shadowColor = ending ? 'rgba(255,255,255,0.9)' : 'rgba(60,255,110,' + (0.7 + 0.3 * pulse).toFixed(2) + ')';
    ctx.shadowBlur = (8 + 5 * pulse) * CFG.ART_SCALE;
    drawTinted(img, x, y, '#3dff6a', 0.12 + 0.12 * pulse);
    ctx.restore();
    if (Math.random() < 0.2) addParticle({ type: 'sparkle', x: playerX() + (Math.random() - 0.4) * 80, y: p.y - 10 - Math.random() * 55, vy: -20, life: 0.4, max: 0.4 });
  } else if (espro) {                       // ESPRO: pink suit + unicorn horn frames, with a pulsing glow
    const ending = game.power.t < 2 && Math.floor(game.t * 8) % 2;
    ctx.save();
    ctx.shadowColor = ending ? 'rgba(255,255,255,0.9)' : 'rgba(255,90,210,' + (0.75 + 0.25 * Math.sin(game.t * 10)).toFixed(2) + ')';
    ctx.shadowBlur = (8 + 4 * Math.sin(game.t * 10)) * CFG.ART_SCALE;
    drawSpr(img, x, y); drawSpr(img, x, y);
    ctx.restore();
    if (Math.random() < 0.25) addParticle({ type: 'sparkle', x: playerX() + (Math.random() - 0.4) * 80, y: p.y - 10 - Math.random() * 55, vy: -20, life: 0.4, max: 0.4 });
  } else drawSpr(img, x, y);
}

function drawEffects() {
  const S = game.scroll;
  for (const q of game.particles) {
    const k = q.life / q.max, x = Math.round(q.x - S), y = Math.round(q.y);
    if (q.type === 'puff') {
      const img = SPR['puff_' + Math.min(3, Math.floor((1 - k) * 4))];
      ctx.globalAlpha = Math.min(1, k * 1.6);
      ctx.drawImage(img, x - (img.width >> 1), y - (img.height >> 1));
      ctx.globalAlpha = 1;
    } else if (q.type === 'px') {
      ctx.fillStyle = q.color; ctx.fillRect(x, y, q.size, q.size);
    } else if (q.type === 'coin') {
      const img = SPR['coin_' + (Math.floor(game.t * 20) % 4)];
      ctx.drawImage(img, x - 6, y - 7);
    } else if (q.type === 'sparkle') {
      ctx.globalAlpha = k; ctx.drawImage(SPR.sparkle, x - 2, y - 2); ctx.globalAlpha = 1;
    }
  }
  for (const t of game.texts) {
    ctx.globalAlpha = Math.min(1, t.life * 3);
    drawText(t.str, t.x - S, t.y, t.s, t.color, 'center');
    ctx.globalAlpha = 1;
  }
}

function muteRect() { return { x: W - 24, y: 4, w: 20, h: 16 }; }
function pauseRect() { return { x: W - 48, y: 4, w: 20, h: 16 }; }
function drawPauseButton() {
  const r = pauseRect();
  ctx.fillStyle = 'rgba(20,10,40,0.55)'; ctx.fillRect(r.x, r.y, r.w, r.h);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(r.x + 6, r.y + 4, 3, 8); ctx.fillRect(r.x + 11, r.y + 4, 3, 8);
}
function drawButton(r, label, bg, hi) {
  ctx.fillStyle = '#1a0a24'; ctx.fillRect(r.x, r.y + 2, r.w, r.h);
  ctx.fillStyle = bg; ctx.fillRect(r.x, r.y, r.w, r.h);
  ctx.fillStyle = hi; ctx.fillRect(r.x, r.y, r.w, 2);
  drawText(label, r.x + r.w / 2, r.y + r.h / 2 - 5, 2, '#ffffff', 'center');
}
function drawPauseMenu() {
  ctx.fillStyle = 'rgba(20,10,40,0.55)'; ctx.fillRect(0, 0, W, H);

  drawText('PAUSED', W / 2, py + 10, 3, TITLE_COLORS, 'center', '#1a0a24');

  drawButton(b.sound, 'SOUND: ' + (Sound.sfxOn ? 'ON' : 'OFF'), Sound.sfxOn ? '#3a8f5a' : '#5a4a6a', Sound.sfxOn ? '#6fd08f' : '#7a6a8a');
  drawButton(b.restart, 'RESTART', '#6a4a9a', '#9a7aca');

}
function drawMuteButton() {
  const r = muteRect();
  ctx.fillStyle = 'rgba(20,10,40,0.55)'; ctx.fillRect(r.x, r.y, r.w, r.h);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(r.x + 4, r.y + 6, 3, 4); ctx.fillRect(r.x + 7, r.y + 5, 1, 6); ctx.fillRect(r.x + 8, r.y + 4, 1, 8); ctx.fillRect(r.x + 9, r.y + 3, 1, 10);

  } else {
    ctx.fillRect(r.x + 12, r.y + 6, 1, 4); ctx.fillRect(r.x + 14, r.y + 4, 1, 8); ctx.fillRect(r.x + 13, r.y + 5, 1, 1); ctx.fillRect(r.x + 13, r.y + 10, 1, 1);
  }
}

function drawHUD() {
  drawText('SCORE', 6, 2, 1, '#ffe066');
  drawText(String(game.score).padStart(6, '0'), 6, 9, 2, '#ffffff');
  drawText('BEST ' + String(game.best).padStart(6, '0'), 6, 22, 1, game.newBest ? '#7dff8a' : '#c8b8e8');
  ctx.drawImage(SPR.coin_0, 64, 7);
  drawText('*' + String(game.coins).padStart(3, '0'), 77, 9, 2, '#ffe066');

  drawText('*' + game.houses, 126, 9, 2, '#ffffff');

  const hx = 160;

  }

    ctx.fillStyle = '#1a0f2e'; ctx.fillRect(bx, by + 9, 58, 6);
    ctx.fillStyle = pw.type === 'espresso' ? '#ff6ec7' : pw.type === 'key' ? '#ffd23f' : '#3dff6a';
    if (pw.t > 2 || Math.floor(game.t * 8) % 2) ctx.fillRect(bx + 1, by + 10, Math.round(56 * frac), 4);
    drawText({ espresso: 'ESPRO 2X', key: 'MAGNET', cash: 'OVER ASKING' }[pw.type], bx, by + 1, 1, '#ffffff');
  }

const TITLE_COLORS = ['#fff3a0', '#ffe066', '#ffb347', '#ff7eb6', '#ff4fa0'];
function drawTitle() {
  drawText('SOLD RAPTOR', W / 2, 8, 5, TITLE_COLORS, 'center', '#2a0d3a');

function render() {
  const K = CFG.ART_SCALE;
  ctx.setTransform(K, 0, 0, K, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.save();
  if (game.shake > 0) ctx.translate(Math.round((Math.random() - 0.5) * 4), Math.round((Math.random() - 0.5) * 4));
  drawBackground();
  ctx.translate(0, rnd(-game.camY));
  drawGround();
  drawWorld();
  if (game.mode !== 'over') drawPlayer();
  drawEffects();
  ctx.restore();
  if (game.mode === 'play') {
    drawHUD();
    if (game.paused) drawPauseMenu();
  } else if (game.mode === 'title') drawTitle();
  else drawGameOver();
}

/* == 10. Input + main loop ====================================================== */
function resize() {
  const aspect = window.innerWidth / window.innerHeight;
  W = Math.round(Math.min(CFG.MAX_W, Math.max(CFG.MIN_W, H * aspect)));
  W += W % 2;
  canvas.width = W * CFG.ART_SCALE; canvas.height = H * CFG.ART_SCALE;
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = Math.floor(W * scale) + 'px';
  canvas.style.height = Math.floor(H * scale) + 'px';
  ctx.imageSmoothingEnabled = false;
  buildSky();
}

function toggleMute() { Sound.muted = !Sound.muted; store.set('soldRaptorMuted', Sound.muted ? '1' : '0'); Sound.apply(); }
function setPaused(on) {
  if (game.mode !== 'play' || game.paused === on) return;
  game.paused = on; input.holding = false; input.pointers.clear();
  if (Sound.ctx) { if (on) Sound.ctx.suspend(); else Sound.ctx.resume(); }   // music and sounds freeze too
}

function pressJump() {
  Sound.init();
  if (game.mode === 'title') { startGame(); return; }
  if (game.mode === 'over') { if (game.overT > 0.5) startGame(); return; }
  if (game.paused) { setPaused(false); return; }
  game.player.jumpBuf = CFG.JUMP_BUFFER;
}

const JUMP_KEYS = ['Space', 'ArrowUp', 'KeyW'];
window.addEventListener('keydown', e => {
  if (JUMP_KEYS.includes(e.code) || e.code === 'Enter') {
    e.preventDefault();
    if (e.repeat) return;
    if (e.code !== 'Enter') input.holding = true;
    if (e.code === 'Enter' && game.mode === 'play') return;
    pressJump();
  } else if (e.code === 'KeyM') { Sound.init(); toggleMute(); }
  else if (e.code === 'KeyP' || e.code === 'Escape') { Sound.init(); setPaused(!game.paused); }
});
window.addEventListener('keyup', e => { if (JUMP_KEYS.includes(e.code)) input.holding = false; });

function canvasXY(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
const inRect = (p, r, pad = 0) => r && p.x >= r.x - pad && p.x <= r.x + r.w + pad && p.y >= r.y - pad && p.y <= r.y + r.h + pad;
window.addEventListener('pointerdown', e => {
  e.preventDefault();
  const pt = canvasXY(e);
  if (inRect(pt, muteRect(), 6)) { Sound.init(); toggleMute(); return; }
  if (game.mode === 'play' && game.paused) {         // pause menu buttons
    const b = game.pauseBtns || {};
    if (inRect(pt, b.resume, 3)) setPaused(false);
    else if (inRect(pt, b.music, 3)) { Sound.musicOn = !Sound.musicOn; store.set('soldRaptorMusic', Sound.musicOn ? '1' : '0'); Sound.apply(); }
    else if (inRect(pt, b.sound, 3)) { Sound.sfxOn = !Sound.sfxOn; store.set('soldRaptorSfx', Sound.sfxOn ? '1' : '0'); Sound.apply(); }
    else if (inRect(pt, b.restart, 3)) { setPaused(false); startGame(); }
    return;
  }
  if (game.mode === 'play' && inRect(pt, pauseRect(), 4)) { Sound.init(); setPaused(true); return; }
  if (game.mode === 'over') {
    Sound.init();
    if (inRect(pt, game.btn, 4) && game.overT > 0.5) startGame();
    return;
  }
  input.pointers.add(e.pointerId); input.holding = true;
  pressJump();
}, { passive: false });
const releasePointer = e => { input.pointers.delete(e.pointerId); if (input.pointers.size === 0) input.holding = false; };
window.addEventListener('pointerup', releasePointer);
window.addEventListener('pointercancel', releasePointer);
window.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
window.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) return;
  if (game.mode === 'play') setPaused(true);
  else if (Sound.ctx) Sound.ctx.suspend();          // no music in the background
});
window.addEventListener('blur', () => { if (game.mode === 'play') setPaused(true); input.holding = false; input.pointers.clear(); });
window.addEventListener('resize', resize);

// Fixed-timestep loop (consistent jump heights on any refresh rate)
const STEP = 1 / 120;
let last = performance.now(), acc = 0;
function frame(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.1) dt = 0.1;
  acc += dt;
  let n = 0;
  while (acc >= STEP && n < 14) { update(STEP); acc -= STEP; n++; }
  if (n >= 14) acc = 0;
  render();
  requestAnimationFrame(frame);
}

function boot() {
  buildAllSprites();
  game.player = newPlayer();
  resize();
  loadImages().then(() => requestAnimationFrame(frame));
}
